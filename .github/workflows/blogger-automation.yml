name: Blogger and CSV Automation

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"
  push:
    paths:
      - "*.csv"
      - "data/*.csv"
      - "csv/*.csv"
      - "scripts/blogger_automation.py"
      - ".github/workflows/blogger-automation.yml"

concurrency:
  group: blogger-csv-automation
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  automate:
    runs-on: ubuntu-latest
    env:
      BLOGGER_BLOG_ID: "1419305768199826334"
      BLOGGER_BATCH_SIZE: "5"
      BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
      BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
      BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependency
        run: python -m pip install --upgrade pip requests
      - name: Generate SEO CSV copies
        run: python scripts/blogger_automation.py seo
      - name: Publish new products and update changed products
        run: |
          if [ -n "$BLOGGER_CLIENT_ID" ] && [ -n "$BLOGGER_CLIENT_SECRET" ] && [ -n "$BLOGGER_REFRESH_TOKEN" ]; then
            python scripts/blogger_automation.py publish
          else
            echo "::warning::SEO copies generated, but Blogger publishing is paused until the three BLOGGER_* secrets are added in repository Actions settings."
          fi
      - name: Commit generated SEO files and sync state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated/
          if [ -d .automation ]; then
            git add .automation/
          fi
          if ! git diff --cached --quiet; then
            git commit -m "Update generated SEO data and Blogger sync state"
            git push
          else
            echo "No generated files or sync-state changes to commit."
          fi
