name: Generate DealZone Product Pages

on:
  push:
    branches: [main]
    paths:
      - "*.csv"
      - "generate_products.py"
      - ".github/workflows/generate-products.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate product pages and sitemap
        run: python generate_products.py

      - name: Commit generated pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add products sitemap.xml robots.txt
          git diff --cached --quiet && echo "No generated changes." && exit 0
          git commit -m "Generate product pages and sitemap [skip ci]"
          git push
