<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DealZone Category</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f5f5f5;color:#222}.top{background:#111;color:#fff;padding:8px 5%;font-size:13px}.head{background:#fff;padding:18px 5%;display:flex;align-items:center;gap:25px;position:sticky;top:0;z-index:5;box-shadow:0 2px 8px #0001}.logo{font-size:28px;font-weight:900;color:#f22;text-decoration:none}.search{flex:1;display:flex;max-width:700px}.search input{width:100%;padding:13px;border:2px solid #f22;border-radius:8px 0 0 8px;font-size:15px}.search button{background:#f22;color:#fff;border:0;padding:0 22px;border-radius:0 8px 8px 0}.nav{background:#fff;padding:0 5% 14px;display:flex;gap:24px;font-weight:700}.nav a{text-decoration:none;color:#222}.wrap{padding:25px 5% 50px}.back{color:#f22;font-weight:700;text-decoration:none}.title{margin:18px 0 6px;font-size:32px}.sub{color:#777;margin-bottom:25px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:18px}.card{background:#fff;border-radius:14px;overflow:hidden;border:1px solid #eee;transition:.2s}.card:hover{transform:translateY(-4px);box-shadow:0 8px 25px #0002}.card img{width:100%;height:210px;object-fit:contain;background:#fff}.info{padding:13px}.name{height:42px;overflow:hidden;font-weight:600;font-size:14px}.price{color:#e22;font-size:21px;font-weight:900;margin-top:9px}.old{text-decoration:line-through;color:#999;font-size:13px;margin-left:7px}.btn{display:block;text-align:center;background:#f22;color:#fff;padding:11px;border-radius:8px;margin-top:12px;font-weight:700}.empty{padding:40px;background:#fff;border-radius:14px;text-align:center;color:#777}@media(max-width:700px){.head{flex-wrap:wrap}.search{order:3;flex-basis:100%}}</style></head><body><div class="top">🔥 DealZone — Hot Deals & Smart Shopping</div><header class="head"><a class="logo" href="index.html">DealZone</a><div class="search"><input id="search" placeholder="Search in this category..."><button onclick="run()">Search</button></div></header><nav class="nav"><a href="index.html">Home</a><a href="index.html#categories">Categories</a></nav><main class="wrap"><a class="back" href="index.html">← All Categories</a><h1 id="title" class="title">Loading...</h1><div id="sub" class="sub"></div><div id="grid" class="grid"></div></main><script>
const OWNER='zbatayoub09-source',REPO='dealzone',BRANCH='main';let products=[];
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function parseCSV(t){let rows=[],row=[],cell='',q=false;for(let i=0;i<t.length;i++){let c=t[i],n=t[i+1];if(c==='"'){if(q&&n==='"'){cell+='"';i++}else q=!q}else if(c===','&&!q){row.push(cell);cell=''}else if((c==='\n'||c==='\r')&&!q){if(c==='\r'&&n==='\n')i++;row.push(cell);cell='';if(row.some(x=>x.trim()))rows.push(row);row=[]}else cell+=c}row.push(cell);if(row.some(x=>x.trim()))rows.push(row);if(!rows.length)return[];let h=rows.shift().map(x=>x.replace(/^\uFEFF/,'').trim());return rows.map(r=>Object.fromEntries(h.map((k,i)=>[k,(r[i]??'').trim()])))}function val(p,...keys){for(const k of keys)if(p[k]!==undefined&&String(p[k]).trim()!=='')return p[k];return ''}function card(p){let title=val(p,'Product Desc','ProductDesc','Title')||'Product',img=val(p,'Image Url','Image URL','ImageUrl'),price=val(p,'Discount Price','DiscountPrice','Price'),old=val(p,'Origin Price','OriginPrice'),cur=val(p,'Currency')||'USD',link=val(p,'Promotion Url','Promotion URL','PromotionUrl')||'#';return `<article class="card"><a href="${esc(link)}" target="_blank" rel="nofollow sponsored noopener"><img src="${esc(img)}" loading="lazy" onerror="this.style.display='none'"><div class="info"><div class="name">${esc(title)}</div><div class="price">${esc(price)} ${esc(cur)} ${old?`<span class="old">${esc(old)}</span>`:''}</div><span class="btn">View Deal</span></div></a></article>`}async function load(){let params=new URLSearchParams(location.search),file=params.get('file'),q=params.get('q');try{let r=await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/?ref=${BRANCH}`,{cache:'no-store'}),list=await r.json();if(file){let f=list.find(x=>x.type==='file'&&x.name===file);if(!f)throw Error('Category not found');products=parseCSV(await fetch(f.download_url,{cache:'no-store'}).then(x=>x.text()));document.title='DealZone - '+f.name.replace(/\.csv$/i,'');document.getElementById('title').textContent=f.name.replace(/\.csv$/i,'')}else if(q){document.getElementById('title').textContent='Search: '+q;let fs=list.filter(x=>x.type==='file'&&/\.csv$/i.test(x.name));for(const f of fs)products.push(...parseCSV(await fetch(f.download_url,{cache:'no-store'}).then(x=>x.text())));products=products.filter(p=>Object.values(p).some(v=>String(v).toLowerCase().includes(q.toLowerCase())))}else throw Error('No category selected');document.getElementById('sub').textContent=products.length+' products';document.getElementById('grid').innerHTML=products.map(card).join('')||'<div class="empty">No products found.</div>'}catch(e){document.getElementById('title').textContent='Error';document.getElementById('sub').textContent=e.message}}function run(){let q=document.getElementById('search').value.trim();if(q)location.href='category.html?q='+encodeURIComponent(q)}document.getElementById('search').addEventListener('keydown',e=>{if(e.key==='Enter')run()});load();</script></body></html>
