<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DealZone Category</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f5f5f5;color:#222}.top{background:#111;color:#fff;padding:8px 5%;font-size:13px}.head{background:#fff;padding:18px 5%;display:flex;align-items:center;gap:25px;position:sticky;top:0;z-index:5;box-shadow:0 2px 8px #0001}.logo{display:flex;align-items:center;width:180px;height:52px;text-decoration:none}.logo img{display:block;width:100%;height:100%;object-fit:contain}.search{flex:1;display:flex;max-width:700px}.search input{width:100%;padding:13px;border:2px solid #f22;border-radius:8px 0 0 8px;font-size:15px}.search button{background:#f22;color:#fff;border:0;padding:0 22px;border-radius:0 8px 8px 0}.nav{background:#fff;padding:0 5% 14px;display:flex;gap:24px;font-weight:700}.nav a{text-decoration:none;color:#222}.wrap{padding:25px 5% 50px}.back{color:#f22;font-weight:700;text-decoration:none}.title{margin:18px 0 6px;font-size:32px}.sub{color:#777;margin-bottom:25px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:18px}.card{background:#fff;border-radius:14px;overflow:hidden;border:1px solid #eee;transition:.2s}.card:hover{transform:translateY(-4px);box-shadow:0 8px 25px #0002}.card img{width:100%;height:210px;object-fit:contain;background:#fff}.info{padding:13px}.name{height:42px;overflow:hidden;font-weight:600;font-size:14px}.price{color:#e22;font-size:21px;font-weight:900;margin-top:9px}.old{text-decoration:line-through;color:#999;font-size:13px;margin-left:7px}.btn{display:block;text-align:center;background:#f22;color:#fff;padding:11px;border-radius:8px;margin-top:12px;font-weight:700}.empty{padding:40px;background:#fff;border-radius:14px;text-align:center;color:#777}@media(max-width:700px){.head{flex-wrap:wrap}.search{order:3;flex-basis:100%}}<style>.category-bar{background:#fff;border-top:1px solid #eee;border-bottom:1px solid #eee;padding:8px 5%;overflow-x:auto;white-space:nowrap;scrollbar-width:thin}.category-bar-inner{display:flex;gap:8px;min-width:max-content}.category-bar a{display:inline-block;padding:9px 13px;border:1px solid #e5e7eb;border-radius:20px;color:#333;text-decoration:none;font-size:12px;font-weight:700;background:#fafafa}.category-bar a:hover{border-color:#f22;color:#f22;background:#fff}.category-bar a.active{background:#f22;color:#fff;border-color:#f22}.page-slider{margin:24px auto;padding:18px;background:#fff;border:1px solid #e7e7e7;border-radius:16px;max-width:1200px}.page-slider-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}.page-slider-head h2{margin:0;font-size:21px}.page-slider-actions{display:flex;gap:7px}.page-slider-actions button{width:34px;height:34px;border-radius:50%;border:1px solid #ddd;background:white;cursor:pointer;font-size:20px}.page-slider-track{display:flex;gap:14px;overflow:auto;scroll-behavior:smooth;scrollbar-width:none}.page-slider-track::-webkit-scrollbar{display:none}.page-slide{flex:0 0 calc((100% - 42px)/4);border:1px solid #eee;border-radius:12px;overflow:hidden;background:#fff}.page-slide img{width:100%;height:175px;object-fit:contain;background:#fafafa}.page-slide-info{padding:10px}.page-slide-name{height:36px;overflow:hidden;font-size:13px;font-weight:700;line-height:1.35}.page-slide-price{color:#e22;font-weight:900;margin-top:7px}.page-slide-old{color:#999;text-decoration:line-through;font-size:11px;margin-left:5px}.page-slide-meta{font-size:11px;color:#667085;margin-top:5px;min-height:14px}.page-slide-btn{display:block;background:#f22;color:#fff;text-align:center;border-radius:7px;padding:8px;margin-top:8px;font-size:12px;font-weight:800}@media(max-width:700px){.page-slide{flex-basis:calc((100% - 14px)/2)}.page-slide img{height:145px}}@media(max-width:430px){.page-slide{flex-basis:78%}}</style></head><body><div class="top">🔥 DealZone — Hot Deals & Smart Shopping</div><header class="head"><a class="logo" href="index.html"><img src="logo.svg" alt="DealZone"></a><div class="search"><input id="search" placeholder="Search in this category..."><button onclick="run()">Search</button></div></header><nav class="nav"><a href="index.html">Home</a><a href="index.html#categories">Categories</a></nav><div class="category-bar"><div class="category-bar-inner">

</div></div><section class="page-slider"><div class="page-slider-head"><h2>Popular Products</h2><div class="page-slider-actions"><button id="pageSliderPrev" aria-label="Previous">‹</button><button id="pageSliderNext" aria-label="Next">›</button></div></div><div class="page-slider-track" id="pageSliderTrack"></div></section><main class="wrap"><a class="back" href="index.html">← All Categories</a><h1 id="title" class="title">Loading...</h1><div id="sub" class="sub"></div><div id="grid" class="grid"></div></main><script>
const OWNER='zbatayoub09-source',REPO='dealzone',BRANCH='main';let products=[];
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function parseCSV(t){let rows=[],row=[],cell='',q=false;for(let i=0;i<t.length;i++){let c=t[i],n=t[i+1];if(c==='"'){if(q&&n==='"'){cell+='"';i++}else q=!q}else if(c===','&&!q){row.push(cell);cell=''}else if((c==='\n'||c==='\r')&&!q){if(c==='\r'&&n==='\n')i++;row.push(cell);cell='';if(row.some(x=>x.trim()))rows.push(row);row=[]}else cell+=c}row.push(cell);if(row.some(x=>x.trim()))rows.push(row);if(!rows.length)return[];let h=rows.shift().map(x=>x.replace(/^\uFEFF/,'').trim());return rows.map(r=>Object.fromEntries(h.map((k,i)=>[k,(r[i]??'').trim()])))}function val(p,...keys){for(const k of keys)if(p[k]!==undefined&&String(p[k]).trim()!=='')return p[k];return ''}function money(x,c){let n=parseFloat(String(x??'').replace(/[^0-9.,-]/g,'').replace(',','.'));return c==='MAD'&&Number.isFinite(n)?(n/11.16).toFixed(2):x}function card(p){let title=val(p,'Product Desc','ProductDesc','Title')||'Product',img=val(p,'Image Url','Image URL','ImageUrl'),price=val(p,'Discount Price','DiscountPrice','Price'),old=val(p,'Origin Price','OriginPrice'),cur=val(p,'Currency')||'USD',link=val(p,'Promotion Url','Promotion URL','PromotionUrl')||'#';price=money(price,cur);old=money(old,cur);if(cur==='MAD')cur='EUR';return `<article class="card"><a href="${esc(link)}" target="_blank" rel="nofollow sponsored noopener"><img src="${esc(img)}" loading="lazy" onerror="this.style.display='none'"><div class="info"><div class="name">${esc(title)}</div><div class="price">${esc(price)} ${esc(cur)} ${old?`<span class="old">${esc(old)}</span>`:''}</div><span class="btn">View Deal</span></div></a></article>`}async function load(){let params=new URLSearchParams(location.search),file=params.get('file'),q=params.get('q');try{let r=await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/?ref=${BRANCH}`,{cache:'no-store'}),list=await r.json();if(file){let f=list.find(x=>x.type==='file'&&x.name===file);if(!f)throw Error('Category not found');products=parseCSV(await fetch(f.download_url,{cache:'no-store'}).then(x=>x.text()));const labels={'malabis rijal - CA_USD_en.csv':"Men's Fashion",'ملابس رجالية - AW_USD_en.csv':'Vetements Hommes','ملابس نسائية - CA_USD_en.csv':"Women's Fashion"};const label=labels[f.name]||f.name.replace(/\.csv$/i,'');document.title='DealZone - '+label;document.getElementById('title').textContent=label}else if(q){document.getElementById('title').textContent='Search: '+q;let fs=list.filter(x=>x.type==='file'&&/\.csv$/i.test(x.name));for(const f of fs)products.push(...parseCSV(await fetch(f.download_url,{cache:'no-store'}).then(x=>x.text())));products=products.filter(p=>Object.values(p).some(v=>String(v).toLowerCase().includes(q.toLowerCase())))}else throw Error('No category selected');document.getElementById('sub').textContent=products.length+' products';document.getElementById('grid').innerHTML=products.map(card).join('')||'<div class="empty">No products found.</div>';renderPageSlider()}catch(e){document.getElementById('title').textContent='Error';document.getElementById('sub').textContent=e.message}}function run(){let q=document.getElementById('search').value.trim();if(q)location.href='category.html?q='+encodeURIComponent(q)}document.getElementById('search').addEventListener('keydown',e=>{if(e.key==='Enter')run()});load();function renderPageSlider(){let host=document.getElementById('pageSliderTrack');if(!host)return;let rows=(products||[]).filter(p=>v(p,'ProductId')||valSafe(p,'ProductId')).slice(0,12);host.innerHTML=rows.map(p=>{let pid=v(p,'ProductId')||valSafe(p,'ProductId')||'',title=v(p,'Product Desc','ProductDesc','Title')||valSafe(p,'Product Desc','ProductDesc','Title')||'Product',img=imageUrl(v(p,'Image Url','Image URL','ImageUrl')||valSafe(p,'Image Url','Image URL','ImageUrl')),price=v(p,'Discount Price','DiscountPrice','Price')||valSafe(p,'Discount Price','DiscountPrice','Price'),old=v(p,'Origin Price','OriginPrice')||valSafe(p,'Origin Price','OriginPrice'),cur=v(p,'Currency')||valSafe(p,'Currency')||'USD',sales=v(p,'Sales180Day')||valSafe(p,'Sales180Day'),fb=v(p,'Positive Feedback')||valSafe(p,'Positive Feedback');price=money(price,cur);old=money(old,cur);if(cur==='MAD')cur='EUR';return '<article class="page-slide"><a href="products/'+encodeURIComponent(pid)+'/" style="color:inherit;text-decoration:none"><img src="'+e(img)+'" loading="lazy" onerror="this.style.visibility=\'hidden\'"><div class="page-slide-info"><div class="page-slide-name">'+e(title)+'</div><div class="page-slide-price">'+e(price)+' '+e(cur)+(old?'<span class="page-slide-old">'+e(old)+'</span>':'')+'</div><div class="page-slide-meta">'+(sales?'🛒 '+e(sales)+' sold':'')+(fb?' · ⭐ '+e(fb):'')+'</div><span class="page-slide-btn">View Product</span></div></a></article>'}).join('');let timer=setInterval(()=>{if(host.scrollLeft+host.clientWidth>=host.scrollWidth-5)host.scrollTo({left:0,behavior:'smooth'});else host.scrollBy({left:(host.querySelector('.page-slide')?.offsetWidth||250)+14,behavior:'smooth'})},3500);host.addEventListener('mouseenter',()=>clearInterval(timer),{once:true});document.getElementById('pageSliderPrev').onclick=()=>host.scrollBy({left:-260,behavior:'smooth'});document.getElementById('pageSliderNext').onclick=()=>host.scrollBy({left:260,behavior:'smooth'});}function valSafe(p,...keys){for(let k of keys){if(p&&p[k]!=null&&String(p[k]).trim())return String(p[k]).trim()}return ''}</script></body></html>
