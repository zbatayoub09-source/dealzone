<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DealZone - CNC Routers & Machinery</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f5f5;color:#222}a{text-decoration:none;color:inherit}.top{background:#111;color:#fff;padding:8px 5%;font-size:13px}.head{background:#fff;padding:16px 5%;display:flex;gap:15px;align-items:center;position:sticky;top:0;z-index:5;box-shadow:0 2px 8px #0001}.logo{font-size:27px;font-weight:900;color:#f22}.search{flex:1;display:flex;max-width:650px}.search input{width:100%;padding:12px;border:2px solid #f22;border-radius:8px 0 0 8px}.search button,.copy{border:0;background:#f22;color:#fff;padding:0 18px;border-radius:0 8px 8px 0;font-weight:700}.nav{background:#fff;padding:0 5% 13px;display:flex;gap:22px;font-weight:700}.wrap{padding:24px 5% 50px}.bar{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.back{color:#f22;font-weight:700}.copy{padding:10px 15px;border-radius:8px;cursor:pointer}.sub{color:#777;margin:8px 0 22px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:18px}.card{background:#fff;border:1px solid #eee;border-radius:14px;overflow:hidden}.card img{width:100%;height:210px;object-fit:contain;background:#fff}.info{padding:13px}.name{height:42px;overflow:hidden;font-weight:600;font-size:14px}.price{color:#e22;font-size:20px;font-weight:900;margin-top:9px}.old{text-decoration:line-through;color:#999;font-size:13px;margin-left:6px}.btn{display:block;background:#f22;color:#fff;text-align:center;padding:10px;border-radius:8px;margin-top:12px;font-weight:700}.more{display:block;margin:28px auto;padding:12px 28px;background:#111;color:#fff;border:0;border-radius:9px;font-weight:700;cursor:pointer}.empty{padding:40px;background:#fff;border-radius:14px;text-align:center;color:#777}@media(max-width:700px){.head{flex-wrap:wrap}.search{order:3;flex-basis:100%}}</style></head><body><div class="top">🔥 DealZone — Hot Deals & Smart Shopping</div><header class="head"><a class="logo" href="index.html">DealZone</a><div class="search"><input id="q" placeholder="Search in this category..."><button onclick="search()">Search</button></div></header><nav class="nav"><a href="index.html">Home</a><a href="index.html#categories">Categories</a></nav><main class="wrap"><div class="bar"><a class="back" href="index.html">← All Categories</a><button class="copy" onclick="copyLink()">Copy Category Link</button></div><h1 id="title">CNC Routers & Machinery</h1><div id="sub" class="sub">Loading...</div><div id="grid" class="grid"></div><button id="more" class="more" onclick="more()" style="display:none">Load More</button></main><script>const CSV='CNC Routers & Machinery.csv';let products=[],shown=0;function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function parseCSV(t){let R=[],r=[],c='',q=0;for(let i=0;i<t.length;i++){let x=t[i],n=t[i+1];if(x==='"'){if(q&&n==='"'){c+='"';i++}else q=!q}else if(x===','&&!q){r.push(c);c=''}else if((x==='\n'||x==='\r')&&!q){if(x==='\r'&&n==='\n')i++;r.push(c);c='';if(r.some(v=>v.trim()))R.push(r);r=[]}else c+=x}r.push(c);if(r.some(v=>v.trim()))R.push(r);if(!R.length)return[];let h=R.shift().map(x=>x.replace(/^\uFEFF/,'').trim());return R.map(a=>Object.fromEntries(h.map((k,i)=>[k,(a[i]??'').trim()])))}function val(p,...k){for(let x of k)if(p[x])return p[x];return''}function card(p){let t=val(p,'Product Desc','ProductDesc','Title')||'Product',im=val(p,'Image Url','Image URL','ImageUrl'),pr=val(p,'Discount Price','DiscountPrice','Price'),old=val(p,'Origin Price','OriginPrice'),cu=val(p,'Currency')||'USD',ln=val(p,'Promotion Url','Promotion URL','PromotionUrl')||'#';return `<article class="card"><a href="${esc(ln)}" target="_blank" rel="nofollow sponsored noopener"><img src="${esc(im)}" loading="lazy" onerror="this.style.display='none'"><div class="info"><div class="name">${esc(t)}</div><div class="price">${esc(pr)} ${esc(cu)} ${old?`<span class="old">${esc(old)}</span>`:''}</div><span class="btn">View Deal</span></div></a></article>`}function render(){let end=Math.min(shown+24,products.length);document.getElementById('grid').insertAdjacentHTML('beforeend',products.slice(shown,end).map(card).join(''));shown=end;document.getElementById('sub').textContent=products.length+' products';document.getElementById('more').style.display=shown<products.length?'block':'none'}async function load(){try{let u='https://raw.githubusercontent.com/zbatayoub09-source/dealzone/main/'+encodeURIComponent(CSV);let r=await fetch(u,{cache:'no-store'});if(!r.ok)throw Error('CSV not found');products=parseCSV(await r.text());render()}catch(e){document.getElementById('sub').textContent=e.message;document.getElementById('grid').innerHTML='<div class="empty">No products found.</div>'}}function more(){render()}function search(){let q=document.getElementById('q').value.trim().toLowerCase();document.getElementById('grid').innerHTML='';shown=0;let old=products;products=q?old.filter(p=>Object.values(p).some(v=>String(v).toLowerCase().includes(q))):old;render();products=old}function copyLink(){navigator.clipboard.writeText(location.href).then(()=>alert('Category link copied!'))}document.getElementById('q').addEventListener('keydown',e=>{if(e.key==='Enter')search()});load();</script></body></html>
