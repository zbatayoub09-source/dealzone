<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DealZone - Deals & Offers</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f5f5f5;color:#222}.top{background:#111;color:#fff;padding:8px 5%;font-size:13px}.head{background:#fff;padding:18px 5%;display:flex;align-items:center;gap:25px;position:sticky;top:0;z-index:5;box-shadow:0 2px 8px #0001}.logo{font-size:28px;font-weight:900;color:#f22;text-decoration:none}.search{flex:1;display:flex;max-width:700px}.search input{width:100%;padding:13px;border:2px solid #f22;border-radius:8px 0 0 8px;font-size:15px}.search button{background:#f22;color:#fff;border:0;padding:0 22px;border-radius:0 8px 8px 0}.nav{background:#fff;padding:0 5% 14px;display:flex;gap:24px;font-weight:700}.nav a{text-decoration:none;color:#222}.wrap{padding:25px 5% 50px}.back{color:#f22;font-weight:700;text-decoration:none}.title{margin:18px 0 6px;font-size:32px}.sub{color:#777;margin-bottom:25px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:18px}.card{background:#fff;border-radius:14px;overflow:hidden;border:1px solid #eee;transition:.2s}.card:hover{transform:translateY(-4px);box-shadow:0 8px 25px #0002}.card img{width:100%;height:210px;object-fit:contain;background:#fff}.info{padding:13px}.name{height:42px;overflow:hidden;font-weight:600;font-size:14px}.price{color:#e22;font-size:21px;font-weight:900;margin-top:9px}.old{text-decoration:line-through;color:#999;font-size:13px;margin-left:7px}.btn{display:block;text-align:center;background:#f22;color:#fff;padding:11px;border-radius:8px;margin-top:12px;font-weight:700}.empty{padding:40px;background:#fff;border-radius:14px;text-align:center;color:#777}@media(max-width:700px){.head{flex-wrap:wrap}.search{order:3;flex-basis:100%}}</style></head><body><div class="top">🔥 DealZone — Hot Deals & Smart Shopping</div><header class="head"><a class="logo" href="index.html">DealZone</a><div class="search"><input id="search" placeholder="Search in this category..."><button onclick="run()">Search</button></div></header><nav class="nav"><a href="index.html">Home</a><a href="index.html#categories">Categories</a></nav><main class="wrap"><a class="back" href="index.html">← All Categories</a><h1 class="title">Deals & Offers</h1><div id="sub" class="sub"></div><div id="grid" class="grid"></div></main><script>const CSV='Deals & Offers.csv';let products=[];function e(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function p(t){let R=[],r=[],c='',q=0;for(let i=0;i<t.length;i++){let x=t[i],n=t[i+1];if(x==='"'){if(q&&n==='"'){c+='"';i++}else q=!q}else if(x===','&&!q){r.push(c);c=''}else if((x==='\n'||x==='\r')&&!q){if(x==='\r'&&n==='\n')i++;r.push(c);c='';if(r.some(v=>v.trim()))R.push(r);r=[]}else c+=x}r.push(c);if(r.some(v=>v.trim()))R.push(r);if(!R.length)return[];let h=R.shift().map(x=>x.replace(/^\uFEFF/,'').trim());return R.map(a=>Object.fromEntries(h.map((k,i)=>[k,(a[i]??'').trim()])))}function v(p,...k){for(let x of k)if(p[x])return p[x];return''}function card(p){let t=v(p,'Product Desc','ProductDesc','Title')||'Product',im=v(p,'Image Url','Image URL','ImageUrl'),pr=v(p,'Discount Price','DiscountPrice','Price'),o=v(p,'Origin Price','OriginPrice'),u=v(p,'Currency')||'USD',l=v(p,'Promotion Url','Promotion URL','PromotionUrl')||'#';return `<article class="card"><a href="${e(l)}" target="_blank" rel="nofollow sponsored noopener"><img src="${e(im)}" loading="lazy"><div class="info"><div class="name">${e(t)}</div><div class="price">${e(pr)} ${e(u)} ${o?`<span class="old">${e(o)}</span>`:''}</div><span class="btn">View Deal</span></div></a></article>`}async function load(){try{let r=await fetch('https://raw.githubusercontent.com/zbatayoub09-source/dealzone/main/'+encodeURIComponent(CSV),{cache:'no-store'});products=p(await r.text());sub.textContent=products.length+' products';grid.innerHTML=products.map(card).join('')||'<div class="empty">No products found.</div>'}catch(e){sub.textContent='No products found.'}}function run(){let q=search.value.trim().toLowerCase();let a=q?products.filter(x=>Object.values(x).some(v=>String(v).toLowerCase().includes(q))):products;grid.innerHTML=a.map(card).join('')||'<div class="empty">No products found.</div>'}search.addEventListener('keydown',e=>{if(e.key==='Enter')run()});load();</script></body></html>
