<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DealZone</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f5f5;color:#222}a{text-decoration:none;color:inherit}.top{background:#111;color:#fff;padding:8px 5%;font-size:13px}.head{background:#fff;padding:18px 5%;display:flex;align-items:center;gap:25px;position:sticky;top:0;z-index:5;box-shadow:0 2px 8px #0001}.logo{font-size:28px;font-weight:900;color:#f22}.search{flex:1;display:flex;max-width:700px}.search input{width:100%;padding:13px;border:2px solid #f22;border-radius:8px 0 0 8px;font-size:15px}.search button{border:0;background:#f22;color:#fff;padding:0 22px;border-radius:0 8px 8px 0}.nav{background:#fff;padding:0 5% 14px;display:flex;gap:24px;font-weight:700;overflow:auto}.hero{margin:25px 5%;padding:45px;border-radius:18px;background:linear-gradient(120deg,#111,#333);color:#fff}.hero h1{font-size:42px;margin:0 0 10px}.hero span{color:#ff3030}.wrap{padding:0 5% 50px}.title{display:flex;justify-content:space-between;align-items:center;margin:28px 0 15px}.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}.cat{background:#fff;border:1px solid #ddd;border-radius:12px;padding:18px;font-weight:700;transition:.2s}.cat:hover{border-color:#f22;transform:translateY(-2px);box-shadow:0 7px 20px #0001}.count{color:#777;font-size:13px;margin-top:6px;font-weight:400}.empty{padding:40px;background:#fff;border-radius:14px;text-align:center;color:#777}.foot{padding:30px 5%;background:#111;color:#aaa;text-align:center;margin-top:40px}@media(max-width:700px){.head{flex-wrap:wrap}.search{order:3;flex-basis:100%}.hero h1{font-size:30px}.hero{padding:30px 20px}}
</style></head><body>
<div class="top">🔥 DealZone — Hot Deals & Smart Shopping</div>
<header class="head"><a class="logo" href="index.html">DealZone</a><div class="search"><input id="search" placeholder="Search products..."><button onclick="goSearch()">Search</button></div></header>
<nav class="nav"><a href="index.html">Home</a><a href="#categories">Categories</a></nav>
<section class="hero"><h1>Discover <span>Great Deals</span></h1><p>Shop products from our latest AliExpress collections.</p></section>
<main class="wrap"><section id="categories"><div class="title"><h2>Categories</h2><span id="status" class="count">Loading...</span></div><div id="cats" class="cats"></div></section></main>
<footer class="foot">© DealZone · Product links may be affiliate links.</footer>
<script>
const OWNER='zbatayoub09-source',REPO='dealzone',BRANCH='main';
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function slug(name){return name.replace(/\.csv$/i,'').toLowerCase().normalize('NFKD').replace(/[\u0300-\u036f]/g,'').replace(/§/g,'-').replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'')}
async function load(){try{let r=await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/?ref=${BRANCH}`,{cache:'no-store'});if(!r.ok)throw Error('GitHub API '+r.status);let list=await r.json();let files=list.filter(x=>x.type==='file'&&/\.csv$/i.test(x.name));document.getElementById('status').textContent=files.length+' categories';document.getElementById('cats').innerHTML=files.map(f=>`<a class="cat" href="${slug(f.name)}.html">${esc(f.name.replace(/\.csv$/i,''))}<div class="count">Open category →</div></a>`).join('')||'<div class="empty">No categories found.</div>'}catch(e){document.getElementById('status').textContent='Loading error';document.getElementById('cats').innerHTML=`<div class="empty">${esc(e.message)}</div>`}}
function goSearch(){let q=document.getElementById('search').value.trim();if(q)location.href='category.html?q='+encodeURIComponent(q)}
document.getElementById('search').addEventListener('keydown',e=>{if(e.key==='Enter')goSearch()});load();
</script></body></html>
