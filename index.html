<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DealZone</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f5f5;color:#222}a{text-decoration:none;color:inherit}.top{background:#111;color:#fff;padding:8px 5%;font-size:13px}.head{background:#fff;padding:18px 5%;display:flex;align-items:center;gap:25px;position:sticky;top:0;z-index:5;box-shadow:0 2px 8px #0001}.logo{font-size:28px;font-weight:900;color:#f22}.search{flex:1;display:flex;max-width:700px}.search input{width:100%;padding:13px;border:2px solid #f22;border-radius:8px 0 0 8px;font-size:15px}.search button{border:0;background:#f22;color:#fff;padding:0 22px;border-radius:0 8px 8px 0}.nav{background:#fff;padding:0 5% 14px;display:flex;gap:24px;font-weight:700;overflow:auto}.hero{margin:25px 5%;padding:45px;border-radius:18px;background:linear-gradient(120deg,#111,#333);color:#fff}.hero h1{font-size:42px;margin:0 0 10px}.hero span{color:#ff3030}.wrap{padding:0 5% 50px}.title{display:flex;justify-content:space-between;align-items:center;margin:28px 0 15px}.cats{display:flex;flex-wrap:wrap;gap:12px}.cat{background:#fff;border:1px solid #ddd;border-radius:12px;padding:15px 20px;font-weight:700;transition:.2s}.cat:hover{border-color:#f22;transform:translateY(-2px)}.count{color:#777;font-size:13px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:18px}.card{background:#fff;border-radius:14px;overflow:hidden;border:1px solid #eee;transition:.2s}.card:hover{transform:translateY(-4px);box-shadow:0 8px 25px #0002}.card img{width:100%;height:210px;object-fit:contain;background:#fff}.info{padding:13px}.name{height:42px;overflow:hidden;font-weight:600;font-size:14px}.price{color:#e22;font-size:21px;font-weight:900;margin-top:9px}.old{text-decoration:line-through;color:#999;font-size:13px;margin-left:7px}.btn{display:block;text-align:center;background:#f22;color:#fff;padding:11px;border-radius:8px;margin-top:12px;font-weight:700}.empty{padding:40px;background:#fff;border-radius:14px;text-align:center;color:#777}.foot{padding:30px 5%;background:#111;color:#aaa;text-align:center;margin-top:40px}@media(max-width:700px){.head{flex-wrap:wrap}.search{order:3;flex-basis:100%}.hero h1{font-size:30px}.hero{padding:30px 20px}}
</style></head><body>
<div class="top">🔥 DealZone — Hot Deals & Smart Shopping</div>
<header class="head"><a class="logo" href="index.html">DealZone</a><div class="search"><input id="search" placeholder="Search products..."><button onclick="goSearch()">Search</button></div></header>
<nav class="nav"><a href="index.html">Home</a><a href="#categories">Categories</a><a href="#featured">Featured Deals</a></nav>
<section class="hero"><h1>Discover <span>Great Deals</span></h1><p>Shop products from our latest AliExpress collections.</p></section>
<main class="wrap"><section id="categories"><div class="title"><h2>Categories</h2><span id="status" class="count">Loading...</span></div><div id="cats" class="cats"></div></section><section id="featured"><div class="title"><h2>Featured Deals</h2></div><div id="products" class="grid"></div></section></main>
<footer class="foot">© DealZone · Product links may be affiliate links.</footer>
<script>
const OWNER='zbatayoub09-source',REPO='dealzone',BRANCH='main';let files=[],all=[];
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function parseCSV(t){let rows=[],row=[],cell='',q=false;for(let i=0;i<t.length;i++){let c=t[i],n=t[i+1];if(c==='"'){if(q&&n==='"'){cell+='"';i++}else q=!q}else if(c===','&&!q){row.push(cell);cell=''}else if((c==='\n'||c==='\r')&&!q){if(c==='\r'&&n==='\n')i++;row.push(cell);cell='';if(row.some(x=>x.trim()))rows.push(row);row=[]}else cell+=c}row.push(cell);if(row.some(x=>x.trim()))rows.push(row);if(!rows.length)return[];let h=rows.shift().map(x=>x.replace(/^\uFEFF/,'').trim());return rows.map(r=>Object.fromEntries(h.map((k,i)=>[k,(r[i]??'').trim()])))}
function nameOf(f){return f.name.replace(/\.csv$/i,'')}
function val(p,...keys){for(const k of keys)if(p[k]!==undefined&&String(p[k]).trim()!=='')return p[k];return ''}
function card(p){let title=val(p,'Product Desc','ProductDesc','Title')||'Product';let img=val(p,'Image Url','Image URL','ImageUrl');let price=val(p,'Discount Price','DiscountPrice','Price');let old=val(p,'Origin Price','OriginPrice');let cur=val(p,'Currency')||'USD';let link=val(p,'Promotion Url','Promotion URL','PromotionUrl')||'#';return `<article class="card"><a href="${esc(link)}" target="_blank" rel="nofollow sponsored noopener"><img src="${esc(img)}" loading="lazy" onerror="this.style.display='none'"><div class="info"><div class="name">${esc(title)}</div><div class="price">${esc(price)} ${esc(cur)} ${old?`<span class="old">${esc(old)}</span>`:''}</div><span class="btn">View Deal</span></div></a></article>`}
async function load(){try{let r=await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/?ref=${BRANCH}`,{cache:'no-store'});if(!r.ok)throw Error('GitHub API '+r.status);let list=await r.json();files=list.filter(x=>x.type==='file'&&/\.csv$/i.test(x.name));let good=[];for(const f of files){try{let t=await fetch(f.download_url,{cache:'no-store'}).then(x=>x.text());let rows=parseCSV(t);if(rows.length)good.push({file:f,rows})}catch(e){console.warn(f.name,e)}}files=good;all=good.flatMap(x=>x.rows.map(p=>({...p,__category:nameOf(x.file)})));document.getElementById('status').textContent=`${files.length} categories · ${all.length} products`;document.getElementById('cats').innerHTML=files.map(x=>`<a class="cat" href="category.html?file=${encodeURIComponent(x.file.name)}">${esc(nameOf(x.file))}<div class="count">${x.rows.length} products</div></a>`).join('');let featured=[...all].sort((a,b)=>parseFloat(val(b,'Discount'))-parseFloat(val(a,'Discount'))).slice(0,20);document.getElementById('products').innerHTML=featured.map(card).join('')||'<div class="empty">No products found.</div>'}catch(e){document.getElementById('status').textContent='Loading error';document.getElementById('cats').innerHTML=`<div class="empty">${esc(e.message)}</div>`}}
function goSearch(){let q=document.getElementById('search').value.trim();if(q)location.href='category.html?q='+encodeURIComponent(q)}
document.getElementById('search').addEventListener('keydown',e=>{if(e.key==='Enter')goSearch()});load();
</script></body></html>
