<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DealZone - Watches</title><style>body{margin:0;font-family:Arial;background:#f5f5f5;color:#222}*{box-sizing:border-box}a{text-decoration:none;color:inherit}.top{background:#111;color:#fff;padding:9px 5%}.head{background:#fff;padding:16px 5%;display:flex;gap:15px;align-items:center;position:sticky;top:0}.logo{font-size:27px;font-weight:900;color:#f22}.search{flex:1;display:flex;max-width:650px}.search input{width:100%;padding:12px;border:2px solid #f22;border-radius:8px 0 0 8px}.search button,.copy{background:#f22;color:#fff;border:0;padding:11px 18px;font-weight:700;border-radius:0 8px 8px 0}.nav{background:#fff;padding:0 5% 13px;display:flex;gap:22px;font-weight:700}.wrap{padding:24px 5% 50px}.bar{display:flex;justify-content:space-between;align-items:center}.back{color:#f22;font-weight:700}.copy{border-radius:8px;cursor:pointer}.sub{color:#777;margin:8px 0 22px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:18px}.card{background:#fff;border:1px solid #eee;border-radius:14px;overflow:hidden}.card img{width:100%;height:210px;object-fit:contain}.info{padding:13px}.name{height:42px;overflow:hidden;font-size:14px;font-weight:600}.price{color:#e22;font-size:20px;font-weight:900;margin-top:9px}.old{text-decoration:line-through;color:#999;font-size:13px;margin-left:6px}.btn{display:block;background:#f22;color:#fff;text-align:center;padding:10px;border-radius:8px;margin-top:12px;font-weight:700}.more{display:block;margin:28px auto;padding:12px 28px;background:#111;color:#fff;border:0;border-radius:8px;font-weight:700}.empty{padding:40px;background:#fff;text-align:center}</style></head><body><div class="top">🔥 DealZone — Hot Deals & Smart Shopping</div><header class="head"><a class="logo" href="index.html">DealZone</a><div class="search"><input id="q" placeholder="Search in this category..."><button onclick="search()">Search</button></div></header><nav class="nav"><a href="index.html">Home</a><a href="index.html#categories">Categories</a></nav><main class="wrap"><div class="bar"><a class="back" href="index.html">← All Categories</a><button class="copy" onclick="navigator.clipboard.writeText(location.href).then(()=>alert('Category link copied!'))">Copy Category Link</button></div><h1>Watches</h1><div id="sub" class="sub">Loading...</div><div id="grid" class="grid"></div><button id="more" class="more" onclick="render()" style="display:none">Load More</button></main><script>const CSV='Watches.csv';let products=[],shown=0;function E(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function P(t){let R=[],r=[],c='',q=0;for(let i=0;i<t.length;i++){let x=t[i],n=t[i+1];if(x==='"'){if(q&&n==='"'){c+='"';i++}else q=!q}else if(x===','&&!q){r.push(c);c=''}else if((x==='\n'||x==='\r')&&!q){if(x==='\r'&&n==='\n')i++;r.push(c);c='';if(r.some(v=>v.trim()))R.push(r);r=[]}else c+=x}r.push(c);if(r.some(v=>v.trim()))R.push(r);if(!R.length)return[];let h=R.shift().map(x=>x.replace(/^\uFEFF/,'').trim());return R.map(a=>Object.fromEntries(h.map((k,i)=>[k,(a[i]??'').trim()])))}function V(p,...k){for(let x of k)if(p[x])return p[x];return''}function C(p){let t=V(p,'Product Desc','ProductDesc','Title')||'Product',im=V(p,'Image Url','Image URL','ImageUrl'),pr=V(p,'Discount Price','DiscountPrice','Price'),o=V(p,'Origin Price','OriginPrice'),u=V(p,'Currency')||'USD',l=V(p,'Promotion Url','Promotion URL','PromotionUrl')||'#';return `<article class="card"><a href="${E(l)}" target="_blank" rel="nofollow sponsored noopener"><img src="${E(im)}" loading="lazy"><div class="info"><div class="name">${E(t)}</div><div class="price">${E(pr)} ${E(u)} ${o?`<span class="old">${E(o)}</span>`:''}</div><span class="btn">View Deal</span></div></a></article>`}function render(){let z=Math.min(shown+24,products.length);grid.insertAdjacentHTML('beforeend',products.slice(shown,z).map(C).join(''));shown=z;sub.textContent=products.length+' products';more.style.display=shown<products.length?'block':'none'}async function load(){try{let r=await fetch('https://raw.githubusercontent.com/zbatayoub09-source/dealzone/main/'+encodeURIComponent(CSV));products=P(await r.text());render()}catch(e){sub.textContent='No products found.'}}function search(){let q=document.getElementById('q').value.toLowerCase(),all=products;products=q?all.filter(p=>Object.values(p).some(v=>String(v).toLowerCase().includes(q))):all;grid.innerHTML='';shown=0;render();products=all}load();</script></body></html>
